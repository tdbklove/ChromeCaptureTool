<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截圖與裁切</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <main class="container">
    <header class="brand">
      <img src="icons/icon-48.png" alt="" width="32" height="32">
      <div>
        <h1>截圖與裁切</h1>
        <p class="subtitle">擷取目前畫面，或自動拼接整頁長圖。</p>
      </div>
    </header>

    <div class="actions">
      <button id="captureButton" type="button" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 2v16h16" />
          <path d="M2 6h16v16" />
        </svg>
        <span>擷取目前畫面</span>
      </button>

      <button id="stitchButton" type="button" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="3" width="14" height="6" rx="1.5" />
          <rect x="5" y="11" width="14" height="6" rx="1.5" />
          <path d="M12 19v2" />
        </svg>
        <span>自動捲動並拼接</span>
      </button>

      <button id="pagesButton" type="button" class="secondary"
        title="自動按「→」鍵逐頁擷取，每頁一張圖（圖片在彈窗中時，請先點開彈窗）">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="13" height="14" rx="1.5" />
          <path d="M19 9l3 3-3 3" />
        </svg>
        <span>翻頁截圖</span>
      </button>

      <button id="stopButton" type="button" class="danger" hidden
        title="停止目前的長截圖或翻頁截圖，已擷取的部分會保留並開啟編輯頁">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1.5" />
        </svg>
        <span>停止截圖（保留已擷取的部分）</span>
      </button>
    </div>

    <!-- 截圖進度與結果；沒有訊息時隱藏 -->
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <ul class="tips">
      <li>先切換到要截取的網頁，再按上方按鈕。</li>
      <li>按「→」鍵可以看下一張圖片的網頁，可用「翻頁截圖」自動逐頁擷取，每頁一張圖；圖片要點開彈窗才會顯示時，請先點開彈窗再開始。</li>
      <li>長條截圖或翻頁截圖時，截到想要的位置（例如評論區之前）可按「停止截圖」，或再按一次同一個快捷鍵，已擷取的部分會保留。</li>
      <li><strong>截圖進行中請勿切換分頁、捲動或操作網頁</strong>，否則會拍到錯誤的畫面；長條截圖偵測到切換分頁時會自動停止。</li>
      <li id="shortcutTip">快捷鍵可在下方的設定中修改。</li>
    </ul>

    <button id="settingsButton" type="button" class="link">
      下載位置與快捷鍵設定
    </button>
  </main>
</body>
</html>
