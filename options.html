<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截圖與裁切：設定</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="options.css">
  <script src="options.js" type="module"></script>
</head>
<body>
  <main class="container">
    <header class="brand">
      <img src="icons/icon-48.png" alt="" width="36" height="36">
      <div>
        <h1>設定</h1>
        <p class="subtitle">設定會自動儲存，下次使用時沿用。</p>
      </div>
    </header>

    <section class="card">
      <h2>下載位置</h2>

      <label class="option">
        <input type="radio" name="mode" value="downloads">
        <span>
          <strong>Chrome「下載」資料夾</strong>
          <small>存到「下載」資料夾底下的子資料夾，不需要任何授權，最穩定。</small>
        </span>
      </label>

      <div class="sub" data-for="downloads">
        <label class="field">
          <span>子資料夾</span>
          <input id="subfolderInput" type="text" placeholder="留白則直接存在「下載」資料夾">
        </label>
        <p class="help">可用「/」建立多層資料夾，例如：截圖/網站圖片</p>

        <label class="check">
          <input id="saveAsInput" type="checkbox">
          每次下載都詢問存檔位置（會跳出「另存新檔」視窗）
        </label>
      </div>

      <label class="option">
        <input type="radio" name="mode" value="folder">
        <span>
          <strong>自訂資料夾</strong>
          <small>存到電腦上任一資料夾，下載時不會跳出視窗。重新開啟瀏覽器後第一次下載，Chrome 可能會再詢問一次是否允許。</small>
        </span>
      </label>

      <div class="sub" data-for="folder">
        <div class="folderRow">
          <span id="folderName" class="folderName">尚未選擇資料夾</span>
          <button id="pickFolderButton" type="button" class="secondary">選擇資料夾</button>
          <button id="clearFolderButton" type="button" class="text">清除</button>
        </div>
      </div>

      <hr>

      <label class="check">
        <input id="perSiteInput" type="checkbox">
        依網站名稱分資料夾（例如 example.com）
      </label>

      <p class="help">
        檔名格式：網站_截圖時間_編號.png，例如 example.com_20261031-142530_img01.png，
        不同次截圖不會互相覆蓋。
      </p>
    </section>

    <section class="card">
      <h2>快捷鍵</h2>
      <ul id="shortcutList" class="shortcuts"></ul>
      <button id="shortcutsButton" type="button" class="secondary">變更快捷鍵</button>
      <p class="help">快捷鍵若與其他程式衝突，可以在 Chrome 的快捷鍵設定頁修改。</p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
