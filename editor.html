<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圖片裁切工具</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="editor.css">
  <script src="editor/main.js" type="module"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <img src="icons/icon-32.png" alt="" width="28" height="28">
      <h1>圖片裁切工具</h1>
      <span id="modeBadge" class="badge">單張截圖</span>
    </div>
    <button id="settingsButton" type="button" class="secondary"
      title="設定下載位置、檔案分類與快捷鍵">下載設定</button>
  </header>

  <p id="status" class="statusBar" role="status" aria-live="polite">
    正在載入圖片……
  </p>

  <main>
    <!-- 左側：截圖預覽與手動選取 -->
    <section class="canvasSection">
      <div class="canvasToolbar">
        <div class="controlGroup inline">
          <span class="groupTitle">手動選取範圍</span>
          <div class="groupButtons">
            <button id="resetButton" type="button" class="secondary"
              title="取消目前拖曳出的手動選取範圍">清除手動選取</button>
            <button id="resetAllButton" type="button" class="secondary"
              title="把所有偵測框還原到自動偵測時的位置，並清除手動選取">還原偵測框</button>
          </div>
        </div>
        <div class="groupButtons">
          <button id="undoButton" type="button" class="secondary" disabled
            title="復原上一步（Ctrl＋Z）">復原</button>
          <button id="redoButton" type="button" class="secondary" disabled
            title="重做（Ctrl＋Y）">重做</button>
          <button id="copySelectionButton" type="button" class="secondary" disabled
            title="把目前手動選取的範圍複製到剪貼簿">複製手動選取範圍</button>
          <button id="saveButton" type="button" class="primary" disabled
            title="下載目前手動選取的範圍（不是偵測框）">下載手動選取範圍</button>
        </div>
      </div>

      <!-- 說明文字依單張／長條模式由 editor/main.js 設定 -->
      <p id="previewHint" class="instruction previewHint"></p>

      <!-- 預覽縮放：也可以在預覽區按住 Ctrl 並滾動滑鼠滾輪 -->
      <div class="zoomBar" role="group" aria-label="預覽縮放">
        <button id="zoomOutButton" type="button" class="secondary" title="縮小（Ctrl＋滾輪向下）">－</button>
        <span id="zoomLabel" class="zoomLabel">符合寬度</span>
        <button id="zoomInButton" type="button" class="secondary" title="放大（Ctrl＋滾輪向上）">＋</button>
        <button id="zoomFitButton" type="button" class="secondary" title="縮放到符合預覽區寬度">符合寬度</button>
        <button id="zoomActualButton" type="button" class="secondary" title="以實際大小（100%）顯示">實際大小</button>
      </div>

      <div id="canvasContainer">
        <!-- 底層為截圖本身，上層為標示圖層（偵測框、移除區域、選取框） -->
        <div id="canvasStage">
          <canvas id="canvas"></canvas>
          <canvas id="overlay"></canvas>
        </div>
      </div>
    </section>

    <!-- 右側：結果與操作 -->
    <section class="resultsSection">
      <div class="sectionHeader">
        <h2 id="resultsTitle">自動偵測結果</h2>
        <p id="resultsInstruction" class="instruction">
          圖片依網頁由上到下、由左到右排序，預設全部勾選。
          可以單獨下載，或勾選後一次下載。
        </p>
      </div>

      <!-- 單張截圖：圖片選取 -->
      <div id="imageBatchControls" class="controlGroup">
        <span class="groupTitle">選擇要下載的圖片</span>
        <div class="groupButtons">
          <button id="selectAllButton" type="button" class="secondary"
            title="勾選所有偵測到的圖片">全選圖片</button>
          <button id="deselectAllButton" type="button" class="secondary"
            title="取消勾選所有圖片">取消選取圖片</button>
          <button id="downloadSelectedButton" type="button" class="primary" disabled
            title="依序下載所有已勾選的圖片">下載選取的圖片（0）</button>
        </div>
      </div>

      <!-- 長條截圖：移除區域 與 下載 -->
      <div id="stitchBatchControls" class="controlGroup" hidden>
        <span class="groupTitle">移除區域（會從長圖中刪除）</span>
        <div class="groupButtons">
          <button id="selectAllCutsButton" type="button" class="secondary"
            title="所有間隔、上下裁切與左右空白都會被移除">全部移除</button>
          <button id="deselectAllCutsButton" type="button" class="secondary"
            title="保留所有區域，不移除任何內容（手動新增的區域會停用，但不會刪除）">全部保留</button>
          <button id="resetCutsButton" type="button" class="secondary"
            title="恢復成預設：所有偵測到的區域都移除，並還原拖曳過的範圍、刪除手動新增的區域">還原自動移除區域</button>
          <button id="addCutButton" type="button" class="secondary" aria-pressed="false"
            title="在預覽區拖曳，手動框出要移除的範圍">手動新增移除區域</button>
        </div>
        <p class="groupHint">
          點擊區域可切換移除或保留；拖曳區域的邊線可調整範圍，範圍可以超出間隔。
        </p>

        <div id="cutList" class="cutList"></div>
      </div>

      <!-- 長條截圖：下載與合併 -->
      <div id="stitchDownloadControls" class="controlGroup" hidden>
        <span class="groupTitle">下載長圖</span>
        <div class="groupButtons">
          <button id="downloadAllGroupsButton" type="button" class="primary" disabled
            title="每一段輸出為一張獨立的長圖">下載全部段落（0）</button>
          <button id="mergeDownloadButton" type="button" class="secondary" disabled
            title="把勾選「加入合併」的段落依序接成一張長圖（移除區域已排除）">合併勾選的段落（0）</button>
        </div>
        <p id="mergeWarning" class="mergeWarning" role="alert" hidden></p>
        <div class="groupButtons">
          <button id="selectAllPartsButton" type="button" class="secondary"
            title="所有段落都加入合併">全選段落</button>
          <button id="deselectAllPartsButton" type="button" class="secondary"
            title="所有段落都不加入合併">取消全選段落</button>
        </div>
        <p class="groupHint">
          勾選要合併的段落（也可以在下方每一段的卡片上勾選「加入合併」），再按「合併勾選的段落」，即可只把需要的段落合併成一張長圖。
        </p>

        <div id="partList" class="cutList"></div>
      </div>

      <!-- 長條截圖：分批擷取的下一批 -->
      <div id="sessionControls" class="controlGroup" hidden>
        <span class="groupTitle">分批截圖</span>
        <div class="groupButtons">
          <button id="continueButton" type="button" class="primary" disabled
            title="切回原頁面，從上一批的結束位置繼續擷取下一批">繼續截圖（下一批）</button>
          <button id="finishButton" type="button" class="text" disabled
            title="結束本次長條截圖，並刪除暫存的截圖資料">結束並清除暫存</button>
        </div>
        <p class="groupHint warningHint">
          繼續截圖時會自動切回原網頁。截圖完成前請勿切換分頁、捲動或操作網頁，切換分頁時會自動停止。
        </p>
      </div>

      <div id="results" class="results">
        <p class="placeholder">正在分析圖片……</p>
      </div>
    </section>
  </main>

  <!-- 合併長圖超過高度上限時的確認視窗 -->
  <dialog id="mergeDialog" class="dialog">
    <form method="dialog">
      <h2>超出合併高度上限</h2>
      <p id="mergeDialogMessage"></p>
      <p id="mergeDialogDetail" class="dialogDetail"></p>
      <div class="dialogButtons">
        <button value="cancel" type="submit" class="secondary">取消</button>
        <button id="mergeDialogConfirm" value="split" type="submit" class="primary">分成多張下載</button>
      </div>
    </form>
  </dialog>
</body>
</html>
